<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nueva Recepción - Biker's Fort</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#690005",
                        "on-secondary": "#2d3138",
                        "on-tertiary-fixed": "#121c2c",
                        "on-primary-fixed": "#181e00",
                        "on-primary-container": "#252d00",
                        "secondary-fixed": "#dfe2ec",
                        "tertiary": "#bdc7dc",
                        "on-surface-variant": "#c7c8b7",
                        "on-primary-fixed-variant": "#404c0a",
                        "outline-variant": "#46483b",
                        "on-primary": "#2b3400",
                        "primary-container": "#89974f",
                        "inverse-surface": "#e4e3d9",
                        "surface-container": "#1f201a",
                        "inverse-primary": "#576421",
                        "surface-bright": "#393a33",
                        "primary-fixed": "#dbea98",
                        "inverse-on-surface": "#30312b",
                        "surface-variant": "#35352f",
                        "surface-container-highest": "#35352f",
                        "surface-container-lowest": "#0e0f0a",
                        "surface": "#13140f",
                        "surface-container-low": "#1b1c17",
                        "secondary-container": "#43474f",
                        "on-error-container": "#ffdad6",
                        "error": "#ffb4ab",
                        "on-secondary-fixed-variant": "#43474f",
                        "secondary-fixed-dim": "#c3c6d0",
                        "tertiary-fixed-dim": "#bdc7dc",
                        "on-background": "#e4e3d9",
                        "on-secondary-container": "#b2b5be",
                        "on-surface": "#e4e3d9",
                        "secondary": "#c3c6d0",
                        "background": "#13140f",
                        "on-tertiary-fixed-variant": "#3d4759",
                        "outline": "#919282",
                        "error-container": "#93000a",
                        "primary-fixed-dim": "#bfce7f",
                        "tertiary-fixed": "#d9e3f9",
                        "on-secondary-fixed": "#181c23",
                        "primary": "#bfce7f",
                        "surface-tint": "#bfce7f",
                        "surface-dim": "#13140f",
                        "tertiary-container": "#8791a5",
                        "surface-container-high": "#2a2a24",
                        "on-tertiary": "#273141",
                        "on-tertiary-container": "#202a3a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "margin-mobile": "16px",
                        "margin-desktop": "40px",
                        "container-max": "1440px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Hanken Grotesk"],
                        "body-sm": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "headline-sm": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "label-caps": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "headline-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "body-sm": ["14px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "headline-md": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "headline-sm": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "800" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .industrial-border { border: 1px solid #2d3748; }
        .industrial-card { background-color: #161a21; }
        .industrial-input { background-color: #0a0c10; border: 1px solid #2d3748; color: #e4e3d9; }
        .industrial-input:focus { border-color: #bfce7f; outline: none; }
        .pattern-bg { background-image: radial-gradient(#2d3748 1px, transparent 1px); background-size: 20px 20px; opacity: 0.05; }
        .btn-primary { background-color: #84924a; color: white; border-top: 1px solid #a3b86c; }
        .lifted-shadow { box-shadow: 4px 4px 0px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="bg-background text-on-background font-body-md relative overflow-x-hidden">
<div class="fixed inset-0 pattern-bg pointer-events-none z-0"></div>
<!-- SideNavBar (Suppressed for focused task intent as per rules, but rules also say map to exact match. 'Reception' is a top-level tab. However, "Nueva Recepción" is a task-focused sub-page (form) implying temporary departure. Rule: Suppress navigation shell for focused journeys. ) -->
<!-- Applying Task-Focused Suppression Rule -->
<main class="relative z-10 w-full min-h-screen p-margin-mobile md:p-margin-desktop lg:max-w-container-max lg:mx-auto">
<!-- Breadcrumb & Header -->
<header class="mb-gutter flex flex-col gap-unit">
<nav class="flex items-center text-on-surface-variant font-label-caps text-label-caps gap-2 mb-2">
<a class="hover:text-primary transition-colors" href="#">Taller</a>
<span class="material-symbols-outlined text-[16px]">chevron_right</span>
<a class="hover:text-primary transition-colors" href="#">Recepciones</a>
<span class="material-symbols-outlined text-[16px]">chevron_right</span>
<span class="text-primary font-bold">Nueva</span>
</nav>
<div class="flex justify-between items-end">
<div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary tracking-tight">Nueva Recepción</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Registrar ingreso de bicicleta al taller.</p>
</div>
<div class="hidden md:flex gap-4">
<button class="px-6 py-3 border border-outline-variant text-on-surface hover:bg-surface-variant transition-colors rounded">Cancelar</button>
<button class="px-6 py-3 btn-primary rounded font-bold hover:brightness-110 transition-all active:scale-[0.98]">Guardar Recepción</button>
</div>
</div>
</header>
<!-- Main Form Layout -->
<div class="grid grid-cols-1 lg:grid-cols-12 gap-gutter items-start">
<!-- Left Column: Client & Bike -->
<div class="lg:col-span-7 flex flex-col gap-gutter">
<!-- Client Data Card -->
<section class="industrial-card industrial-border rounded-lg p-6 relative group hover:border-[#4a5568] transition-colors">
<div class="flex items-center gap-3 mb-6 border-b border-[#2d3748] pb-4">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">person_search</span>
<h2 class="font-headline-sm text-headline-sm text-on-surface">Datos del Cliente</h2>
</div>
<div class="relative mb-6">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2">BUSCAR EN CRM</label>
<div class="flex">
<span class="material-symbols-outlined absolute left-3 top-[38px] text-on-surface-variant">search</span>
<input class="w-full industrial-input rounded p-3 pl-10" placeholder="Nombre, teléfono o email..." type="text"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2">NOMBRE COMPLETO</label>
<input class="w-full industrial-input rounded p-3" disabled="" placeholder="Autocompletado" type="text"/>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2">TELÉFONO</label>
<input class="w-full industrial-input rounded p-3" disabled="" placeholder="Autocompletado" type="text"/>
</div>
</div>
</section>
<!-- Bike Data Card -->
<section class="industrial-card industrial-border rounded-lg p-6 hover:border-[#4a5568] transition-colors">
<div class="flex items-center gap-3 mb-6 border-b border-[#2d3748] pb-4">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">pedal_bike</span>
<h2 class="font-headline-sm text-headline-sm text-on-surface">Datos de la Bicicleta</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2">MARCA</label>
<select class="w-full industrial-input rounded p-3 appearance-none">
<option>Seleccionar marca...</option>
<option>Trek</option>
<option>Specialized</option>
<option>Giant</option>
</select>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2">MODELO</label>
<input class="w-full industrial-input rounded p-3" placeholder="Ej. Marlin 7" type="text"/>
</div>
<div class="md:col-span-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2">NÚMERO DE SERIE</label>
<div class="flex gap-2">
<input class="w-full industrial-input rounded p-3 font-mono text-sm" placeholder="S/N..." type="text"/>
<button class="p-3 border border-[#2d3748] rounded hover:bg-surface-variant text-on-surface-variant" title="Escanear">
<span class="material-symbols-outlined">barcode_scanner</span>
</button>
</div>
</div>
</div>
</section>
</div>
<!-- Right Column: Reason & Accessories -->
<div class="lg:col-span-5 flex flex-col gap-gutter">
<!-- Reason Card -->
<section class="industrial-card industrial-border rounded-lg p-6 hover:border-[#4a5568] transition-colors">
<div class="flex items-center gap-3 mb-6 border-b border-[#2d3748] pb-4">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">build</span>
<h2 class="font-headline-sm text-headline-sm text-on-surface">Motivo de Ingreso</h2>
</div>
<div class="mb-4 flex gap-2 flex-wrap">
<button class="px-3 py-1 font-label-caps text-label-caps rounded border border-primary text-primary bg-primary/10 hover:bg-primary/20 transition-colors">MANTENIMIENTO GENERAL</button>
<button class="px-3 py-1 font-label-caps text-label-caps rounded border border-outline-variant text-on-surface-variant hover:border-on-surface transition-colors">REPARACIÓN</button>
<button class="px-3 py-1 font-label-caps text-label-caps rounded border border-outline-variant text-on-surface-variant hover:border-on-surface transition-colors">GARANTÍA</button>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2">DESCRIPCIÓN DEL PROBLEMA</label>
<textarea class="w-full industrial-input rounded p-3 h-32 resize-none" placeholder="Detalle los síntomas o requerimientos del cliente..."></textarea>
</div>
</section>
<!-- Accessories Card -->
<section class="industrial-card industrial-border rounded-lg p-6 hover:border-[#4a5568] transition-colors">
<div class="flex items-center gap-3 mb-6 border-b border-[#2d3748] pb-4">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">backpack</span>
<h2 class="font-headline-sm text-headline-sm text-on-surface">Accesorios Dejados</h2>
</div>
<div class="grid grid-cols-2 gap-4">
<label class="flex items-center gap-3 p-3 industrial-input rounded cursor-pointer hover:border-primary transition-colors">
<input class="form-checkbox text-primary bg-[#0a0c10] border-[#2d3748] rounded focus:ring-primary focus:ring-offset-0" type="checkbox"/>
<span class="font-body-sm text-body-sm">Luces</span>
</label>
<label class="flex items-center gap-3 p-3 industrial-input rounded cursor-pointer hover:border-primary transition-colors">
<input class="form-checkbox text-primary bg-[#0a0c10] border-[#2d3748] rounded focus:ring-primary focus:ring-offset-0" type="checkbox"/>
<span class="font-body-sm text-body-sm">Ciclocomputador</span>
</label>
<label class="flex items-center gap-3 p-3 industrial-input rounded cursor-pointer hover:border-primary transition-colors">
<input class="form-checkbox text-primary bg-[#0a0c10] border-[#2d3748] rounded focus:ring-primary focus:ring-offset-0" type="checkbox"/>
<span class="font-body-sm text-body-sm">Candado</span>
</label>
<label class="flex items-center gap-3 p-3 industrial-input rounded cursor-pointer hover:border-primary transition-colors">
<input class="form-checkbox text-primary bg-[#0a0c10] border-[#2d3748] rounded focus:ring-primary focus:ring-offset-0" type="checkbox"/>
<span class="font-body-sm text-body-sm">Bolso asiento</span>
</label>
</div>
<div class="mt-4">
<input class="w-full industrial-input rounded p-3 text-sm" placeholder="Otros (especificar)..." type="text"/>
</div>
</section>
</div>
</div>
<!-- Mobile Sticky Action Bar -->
<div class="md:hidden fixed bottom-0 left-0 right-0 bg-[#161a21] border-t border-[#2d3748] p-4 flex gap-4 z-50 lifted-shadow">
<button class="flex-1 py-3 border border-outline-variant text-on-surface hover:bg-surface-variant transition-colors rounded font-bold">Cancelar</button>
<button class="flex-1 py-3 btn-primary rounded font-bold hover:brightness-110 transition-all active:scale-[0.98]">Guardar</button>
</div>
</main>
</body></html>
